apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ebeecontrol.fullname" . }}
  labels:
    {{- include "ebeecontrol.labels" . | nindent 4 }}
rules:
  # Pod isolation - create/update NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read pods for context
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read services for discovery
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Read/write secrets for honeytoken deployment
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ebeecontrol.fullname" . }}
  labels:
    {{- include "ebeecontrol.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ebeecontrol.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ebeecontrol.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
