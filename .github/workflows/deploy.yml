name: Deploy — Build, Push, Deploy to GKE

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PROJECT_ID: ebeecontrol
  GKE_ZONE: us-central1-a
  GKE_CLUSTER: ebeecontrol-cluster
  IMAGE: gcr.io/ebeecontrol/ebeecontrol
  NAMESPACE: ebeecontrol

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run tests before anything else
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ─────────────────────────────────────────────
  # Job 2: Terraform — Provision GKE infrastructure
  # Only runs when terraform files change or on manual dispatch
  # ─────────────────────────────────────────────
  infrastructure:
    needs: test
    if: ${{ github.event.inputs.destroy == 'true' || contains(github.event.head_commit.modified, 'terraform/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_dynatrace_metrics_endpoint: ${{ secrets.DYNATRACE_METRICS_ENDPOINT }}
          TF_VAR_dynatrace_log_endpoint: ${{ secrets.DYNATRACE_LOG_ENDPOINT }}
          TF_VAR_dynatrace_api_token: ${{ secrets.DYNATRACE_API_TOKEN }}

      - name: Terraform Apply
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: ${{ github.event.inputs.destroy == 'true' }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_dynatrace_metrics_endpoint: ${{ secrets.DYNATRACE_METRICS_ENDPOINT }}
          TF_VAR_dynatrace_log_endpoint: ${{ secrets.DYNATRACE_LOG_ENDPOINT }}
          TF_VAR_dynatrace_api_token: ${{ secrets.DYNATRACE_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3: Build and push Docker image to GCR
  # ─────────────────────────────────────────────
  build-and-push:
    needs: test
    if: ${{ github.event.inputs.destroy != 'true' }}
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Generate image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image (linux/amd64)
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push to GCR
        run: |
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.IMAGE }}:latest

  # ─────────────────────────────────────────────
  # Job 4: Deploy to GKE + Install Tetragon + Apply Policies
  # ─────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: ${{ github.event.inputs.destroy != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      # ── Deploy eBeeControl via Helm ──
      - name: Clean up failed Helm release
        run: |
          helm uninstall ebeecontrol --namespace ${{ env.NAMESPACE }} 2>/dev/null || true

      - name: Deploy eBeeControl
        run: |
          helm upgrade --install ebeecontrol ./helm/ebeecontrol \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.IMAGE }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set image.pullPolicy=Always \
            --set dynatrace.metricsEndpoint=${{ secrets.DYNATRACE_METRICS_ENDPOINT }} \
            --set dynatrace.logEndpoint=${{ secrets.DYNATRACE_LOG_ENDPOINT }} \
            --timeout 5m \
            --atomic

      - name: Wait for rollout
        run: |
          sleep 10
          kubectl rollout status deployment/ebeecontrol \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=180s || true

      # ── Create Dynatrace secret ──
      - name: Configure Dynatrace secret
        run: |
          kubectl create secret generic ebeecontrol-dynatrace \
            --from-literal=api-token=${{ secrets.DYNATRACE_API_TOKEN }} \
            --namespace ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Install Tetragon ──
      - name: Install Tetragon
        run: |
          helm repo add cilium https://helm.cilium.io
          helm repo update
          helm upgrade --install tetragon cilium/tetragon \
            --namespace kube-system \
            --set tetragon.grpc.enabled=true \
            --set tetragon.grpc.address="localhost:54321" \
            --wait --timeout 3m

      # ── Apply Tetragon TracingPolicy ──
      - name: Apply honeytoken tracing policies
        run: |
          kubectl apply -f k8s/tetragon/honeytoken-tracing-policy.yaml

      # ── Verify deployment ──
      - name: Verify eBeeControl is running
        run: |
          kubectl rollout status deployment/ebeecontrol \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=120s

      - name: Show agent logs
        run: |
          kubectl logs -n ${{ env.NAMESPACE }} \
            -l app.kubernetes.io/name=ebeecontrol \
            --tail=20

      - name: Verify Tetragon is running
        run: |
          kubectl rollout status daemonset/tetragon \
            --namespace kube-system \
            --timeout=120s

      - name: Verify TracingPolicy applied
        run: |
          kubectl get tracingpolicies -n ${{ env.NAMESPACE }}
