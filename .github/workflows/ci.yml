name: CI — Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Notify OllinAI
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PAYLOAD='{"commitShas":["${{ github.sha }}"],"author":"${{ github.actor }}","services":["other-repo-name"],"deploymentTimestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","environment":"production"}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.OLLINAI_SECRET_KEY }}" -binary | xxd -p -c 256)
          curl -s -X POST "https://ollin-ai.vercel.app/api/webhooks/deployments" \
            -H "Content-Type: application/json" \
            -H "X-OllinAI-Signature: $SIGNATURE" \
            -H "X-OllinAI-Integration: ${{ secrets.OLLINAI_TENANT_ID }}:${{ secrets.OLLINAI_INTEGRATION_ID }}" \
            -d "$PAYLOAD"
